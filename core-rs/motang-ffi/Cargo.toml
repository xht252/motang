[package]
name = "motang-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "墨唐 Kotlin↔Rust 绑定层（uniffi）"

[lib]
name = "motang_ffi"
# cdylib 供 Android 加载；rlib 供 uniffi-bindgen 与单测。
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = { workspace = true }
motang-search = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tantivy = { workspace = true }
zstd = { workspace = true }

# 绑定生成器与库同版本、同 crate，避免 cargo install 造成版本漂移。
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
bindgen-cli = ["uniffi/cli"]
